<!DOCTYPE html>
<html>
    <head>
        <title>Sign up / Login</title>
        <link rel="stylesheet" type="text/css" href="loginstyle.css">
        <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav>
            <ul>
                <li class="name"><a href="../src/landing.html">GUNITA</a></li>
                <li><a href="../src/about.html">About</a></li>
                <li><a href="../src/contact.html">Contact Us</a></li>
                <li><a href="../src/settings.html">Settings</a></li>
            </ul>
        </nav>
        <main>
            <input type="checkbox" id="chk" aria-hidden="true">

            <div class="signup">
                <form>
                    <label for="chk" aria-hidden="true">Sign up</label>
                    <input type="text" name="txt" placeholder="User name" required="">
                    <input type="email" name="email" placeholder="Email" required="">
                    <input type="password" name="pwd" placeholder="Password" required="">
                    <button>Sign up</button>
                </form>
            </div>

            <div class="login">
                <form>
                    <label for="chk" aria-hidden="true">Login</label>
                    <input type="email" name="email" placeholder="Email" required="">
                    <input type="password" name="pwd" placeholder="Password" required="">
                    <button>Login</button>
                </form>
            </div>

        </main>
        <footer>
            <p>&copy; 2024 Gunita. All Rights Reserved</p>
        </footer>
    </body>
</html>
